<!doctype html>
<html lang="ru" data-theme="dark" data-design="new" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          localStorage.removeItem('rt-design-mode');
          document.documentElement.setAttribute('data-design', 'new');
          var t = localStorage.getItem('rt-theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
    <title>REDWOOD — Портал Законопроектов</title>
    <meta name="description" content="Официальная база законодательных инициатив, нормативно-правовых актов и текущих законопроектов REDWOOD." />

    <!-- Open Graph / Facebook / Discord / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zakonoproekti.duckdns.org/" />
    <meta property="og:title" content="REDWOOD — Портал Законопроектов" />
    <meta property="og:description" content="Официальная база законодательных инициатив, нормативно-правовых актов и текущих законопроектов REDWOOD." />
    <meta property="og:image" content="https://zakonoproekti.duckdns.org/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / Discord Large Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REDWOOD — Портал Законопроектов" />
    <meta name="twitter:description" content="Официальная база законодательных инициатив, нормативно-правовых актов и текущих законопроектов REDWOOD." />
    <meta name="twitter:image" content="https://zakonoproekti.duckdns.org/og-banner.png" />

    <!-- Discord Theme Color (строгий графитовый оттенок полосы) -->
    <meta name="theme-color" content="#1e2327" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
