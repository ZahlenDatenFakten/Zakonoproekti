version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zakonoproekti_db
    restart: always
    environment:
      POSTGRES_DB: zakonoproekti
      POSTGRES_USER: zakonoproekti_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zk_pg_pass_2026_secure}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakonoproekti_user -d zakonoproekti"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: state_registry_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://zakonoproekti_user:${DB_PASSWORD:-zk_pg_pass_2026_secure}@db:5432/zakonoproekti
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - config_data:/app/config
      - uploads_data:/app/uploads
      - admin_token:/app/admin_token
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  config_data:
  uploads_data:
  admin_token:
  pgdata:
